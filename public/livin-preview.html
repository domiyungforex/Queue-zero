<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIVIN Character Creator</title><style>
:root{--bg:#171411;--paper:#f4eee3;--ink:#1e1b17;--orange:#e87524}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:white}button,input{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:1.2fr .8fr}.stage{position:sticky;top:0;height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#70452c 0,transparent 30%),linear-gradient(150deg,#2b241e,#0d0b09);overflow:hidden}.stage:after{content:"";position:absolute;inset:auto 7% 4%;height:28%;background:linear-gradient(90deg,#e8752418 1px,transparent 1px),linear-gradient(#e8752412 1px,transparent 1px);background-size:44px 44px;transform:perspective(500px) rotateX(68deg);transform-origin:bottom}.brand{position:absolute;left:24px;top:24px;z-index:4}.brand b{display:block;font-size:28px;letter-spacing:-.06em}.brand small{color:#d68c5b;letter-spacing:.15em}.panel{background:var(--paper);color:var(--ink);padding:30px;overflow:auto}.panel h1{font-size:42px;line-height:.95;letter-spacing:-.05em;margin:10px 0 24px}.tabs{display:flex;gap:7px;margin-bottom:26px;flex-wrap:wrap}.tabs button{border:1px solid #d5ccbd;background:white;border-radius:99px;padding:8px 11px;font-weight:800}.tabs .active{background:#1e1b17;color:white}.section{display:none}.section.active{display:block}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice button,.preset button{border:1px solid #d6ccbd;background:white;border-radius:15px;padding:13px;text-align:left;font-weight:800}.choice button.active,.preset button.active{outline:2px solid var(--orange)}label.row{display:block;padding:10px 0;border-bottom:1px solid #ddd4c7}.row span{display:flex;justify-content:space-between;font-weight:800;font-size:13px}.row input{width:100%;accent-color:var(--orange)}.swatches{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 22px}.swatches button{width:38px;height:38px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 1px #aaa}.swatches button.active{box-shadow:0 0 0 3px var(--orange)}.preset{display:flex;gap:8px;flex-wrap:wrap}.field input[type=text]{width:100%;padding:14px;border:1px solid #d6ccbd;border-radius:13px}.next{width:100%;margin-top:28px;border:0;border-radius:16px;padding:15px;background:var(--orange);color:white;font-weight:900}.avatar{width:min(520px,88%);height:88%;z-index:2}.summary{display:flex;gap:8px;flex-wrap:wrap}.summary span{background:white;border:1px solid #d6ccbd;border-radius:999px;padding:8px 10px;font-size:12px;font-weight:800}@media(max-width:820px){.app{grid-template-columns:1fr}.stage{height:50vh;position:relative}.panel{padding:22px}.avatar{height:96%}.panel h1{font-size:36px}}
</style></head><body><div class="app"><section class="stage"><div class="brand"><small>LIVE PREVIEW</small><b>LIVIN</b></div><svg id="avatar" class="avatar" viewBox="0 0 360 640" aria-label="Character avatar"></svg></section><section class="panel"><div class="tabs" id="tabs"></div><div id="content"></div></section></div><script>
const state={name:'',gender:'female',skin:'#8a4f2c',height:52,build:48,chest:50,waist:46,hips:58,glutes:58,shoulders:45,hair:'braids',hairColor:'#17100d',top:'#ea6f28',bottom:'#272421',vibe:'Lekki Baddie'};const steps=['Identity','Body','Hair','Style','Finish'];let step=0;
const skins=['#f0bf8f','#c98557','#a7613b','#8a4f2c','#6f3c24','#4b2a20','#2e1c18'];const hairs=['afro','braids','locs','fade','waves','buzz'];const vibes={'Mainland Hustler':['#20201e','#5b513d'],'Yaba Techie':['#f2eee7','#252b34'],'Lekki Baddie':['#f26d8a','#1e1d22'],'Corporate':['#eee6d8','#292725'],'Native Luxury':['#c77b24','#4b2c1d']};
function set(k,v){state[k]=v;localStorage.setItem('livin-static-character',JSON.stringify(state));render()}
function renderAvatar(){const h=.9+state.height/500,b=.88+state.build/400,hip=.82+state.hips/290,sh=.9+state.shoulders/360,ch=.86+state.chest/320,gl=.9+state.glutes/360,f=state.gender==='female';let hair='';if(state.hair==='afro')hair='<circle cx="180" cy="88" r="52"/><circle cx="145" cy="108" r="28"/><circle cx="215" cy="108" r="28"/>';else if(state.hair==='braids'||state.hair==='locs'){hair='<path d="M140 110 Q140 63 180 62 Q222 63 220 111 Q207 83 180 83 Q153 83 140 110Z"/>'+[0,1,2,3,4,5].map(n=>'<rect x="'+(139+n*15)+'" y="85" width="7" height="'+(98+n%2*18)+'" rx="4"/>').join('')}else hair='<path d="M143 111 Q145 69 180 68 Q216 69 218 111 Q204 88 180 88 Q156 88 143 111Z"/>';document.getElementById('avatar').innerHTML='<defs><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".22"/></filter></defs><g transform="translate(180 325) scale('+b+' '+h+') translate(-180 -325)" filter="url(#s)"><g fill="'+state.bottom+'"><path d="M'+(142-(hip-1)*20)+' 393 C145 450 143 520 137 590 L169 590 L177 405 Z"/><path d="M'+(218+(hip-1)*20)+' 393 C215 450 217 520 223 590 L191 590 L183 405 Z"/></g><g fill="#201d1a"><path d="M133 586 Q151 578 170 587 L170 606 Q146 615 124 605 Z"/><path d="M190 587 Q209 578 227 586 L236 605 Q214 615 190 606 Z"/></g><path fill="'+state.skin+'" d="M180 194 C150 194 '+(148/sh)+' 210 '+(141/sh)+' 247 L134 350 C139 384 '+(150/hip)+' 410 180 414 C210 410 '+(221*hip)+' 384 '+(226*hip)+' 350 L'+(219*sh)+' 247 C'+(212*sh)+' 210 210 194 180 194 Z"/><path fill="'+state.top+'" d="M180 208 C'+(154-(sh-1)*18)+' 208 '+(145-(sh-1)*24)+' 223 '+(140-(sh-1)*26)+' 258 L148 342 Q180 355 212 342 L'+(220+(sh-1)*26)+' 258 C'+(215+(sh-1)*24)+' 223 '+(206+(sh-1)*18)+' 208 180 208 Z"/>'+(f?'<g opacity=".15"><ellipse cx="162" cy="250" rx="'+(18*ch)+'" ry="'+(14*ch)+'"/><ellipse cx="198" cy="250" rx="'+(18*ch)+'" ry="'+(14*ch)+'"/></g>':'')+'<path fill="'+state.bottom+'" d="M'+(144-(hip-1)*20)+' 342 Q180 327 '+(216+(hip-1)*20)+' 342 L'+(217+(gl-1)*14)+' 420 Q180 434 '+(143-(gl-1)*14)+' 420 Z"/><g fill="'+state.skin+'"><path d="M'+(140-(sh-1)*28)+' 236 Q'+(115-(sh-1)*20)+' 266 111 340 Q112 354 124 350 L151 255 Z"/><path d="M'+(220+(sh-1)*28)+' 236 Q'+(245+(sh-1)*20)+' 266 249 340 Q248 354 236 350 L209 255 Z"/><rect x="167" y="166" width="26" height="50" rx="12"/><ellipse cx="180" cy="125" rx="38" ry="50"/></g><g fill="#241a16"><ellipse cx="165" cy="124" rx="3.6" ry="4.2"/><ellipse cx="195" cy="124" rx="3.6" ry="4.2"/><path d="M172 146 Q180 151 188 146 Q183 157 172 146Z"/></g><g fill="'+state.hairColor+'">'+hair+'</g></g>'}
function slider(k,label){return '<label class="row"><span><b>'+label+'</b><i>'+state[k]+'</i></span><input type="range" min="15" max="85" value="'+state[k]+'" oninput="set(\''+k+'\',+this.value)"></label>'}
function render(){document.getElementById('tabs').innerHTML=steps.map((s,i)=>'<button class="'+(i===step?'active':'')+'" onclick="step='+i+';render()">'+s+'</button>').join('');let html='';if(step===0)html='<small>IDENTITY</small><h1>Start with you.</h1><label class="field">Character name<input type="text" value="'+state.name+'" placeholder="Enter your name" oninput="set(\'name\',this.value)"></label><h3>Character</h3><div class="choice"><button class="'+(state.gender==='female'?'active':'')+'" onclick="set(\'gender\',\'female\')">Female<br><small>Curvy, athletic, slim and more</small></button><button class="'+(state.gender==='male'?'active':'')+'" onclick="set(\'gender\',\'male\')">Male<br><small>Broad, athletic, slim and more</small></button></div><h3>Skin tone</h3><div class="swatches">'+skins.map(s=>'<button class="'+(state.skin===s?'active':'')+'" style="background:'+s+'" onclick="set(\'skin\',\''+s+'\')"></button>').join('')+'</div>';if(step===1)html='<small>BODY</small><h1>Shape your silhouette.</h1>'+slider('height','Height')+slider('build','Body build')+slider('chest',state.gender==='female'?'Bust':'Chest')+slider('waist','Waist')+slider('hips','Hips')+slider('glutes','Glutes')+slider('shoulders','Shoulders');if(step===2)html='<small>HAIR</small><h1>Choose your look.</h1><div class="choice">'+hairs.map(h=>'<button class="'+(state.hair===h?'active':'')+'" onclick="set(\'hair\',\''+h+'\')">'+h[0].toUpperCase()+h.slice(1)+'</button>').join('')+'</div><h3>Hair colour</h3><div class="swatches">'+['#17100d','#3c2519','#6a3f26','#20252a'].map(s=>'<button class="'+(state.hairColor===s?'active':'')+'" style="background:'+s+'" onclick="set(\'hairColor\',\''+s+'\')"></button>').join('')+'</div>';if(step===3)html='<small>STYLE</small><h1>Your starting vibe.</h1><div class="choice">'+Object.keys(vibes).map(v=>'<button class="'+(state.vibe===v?'active':'')+'" onclick="state.vibe=\''+v+'\';state.top=\''+vibes[v][0]+'\';state.bottom=\''+vibes[v][1]+'\';render()">'+v+'</button>').join('')+'</div>';if(step===4)html='<small>READY</small><h1>'+(state.name||'Your character')+' is ready.</h1><div class="summary"><span>'+state.gender+'</span><span>'+state.vibe+'</span><span>'+state.hair+'</span></div><p>You begin with <b>₦15,000</b>. Your life starts in Lagos.</p><button class="next" onclick="alert(\'Character saved locally. Welcome to LIVIN, \'+(state.name||\'player\')+\'!\')">Enter Lagos</button>';document.getElementById('content').innerHTML=html+(step<4?'<button class="next" onclick="step=Math.min(4,step+1);render()">Continue</button>':'');renderAvatar()}
try{Object.assign(state,JSON.parse(localStorage.getItem('livin-static-character')||'{}'))}catch(e){}render();
</script></body></html>

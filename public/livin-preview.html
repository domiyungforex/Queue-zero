<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LIVIN — Landscape Preview</title>
<style>
:root{--bg:#0d0d0e;--panel:#171719;--panel2:#202024;--line:#2b2b30;--text:#f7f4ef;--muted:#aaa5a0;--gold:#f3b755;--green:#7ddc98;--red:#ff7d7d;--blue:#7ab6ff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}button{cursor:pointer}
#rotate{display:none}
.app{min-height:100vh;display:grid;grid-template-columns:92px minmax(0,1fr);background:radial-gradient(circle at 78% 14%,#2e2518 0,transparent 28%),linear-gradient(145deg,#101011,#0b0b0c)}
.nav{position:sticky;top:0;height:100vh;background:#0b0b0ceF;border-right:1px solid #222;padding:14px 8px;display:grid;grid-template-rows:auto 1fr auto;z-index:5}
.logo{display:grid;place-items:center;height:58px;font-weight:1000;letter-spacing:-.08em;font-size:22px}
.navlist{display:grid;align-content:center;gap:8px}
.nav button{border:0;background:transparent;color:#78777c;border-radius:15px;padding:9px 4px;min-height:54px;font-weight:800;font-size:10px}
.nav button b{display:block;font-size:17px;margin-bottom:3px}.nav button.active{background:#1e1e22;color:white}.nav .dot{width:8px;height:8px;border-radius:50%;background:var(--green);margin:auto}
.shell{min-width:0;display:grid;grid-template-rows:auto 1fr}
.topbar{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #242428;background:#101012df;backdrop-filter:blur(14px);position:sticky;top:0;z-index:4}
.topbar small{display:block;color:var(--muted);margin-top:2px}.money{font-weight:950;font-size:18px;padding:10px 14px;border-radius:13px;background:#222226}.previewBadge{font-size:10px;letter-spacing:.15em;color:var(--gold);font-weight:900}
.content{padding:18px 22px 28px;max-width:1500px;width:100%;margin:auto}
.view{display:none}.view.active{display:block}
.head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:14px}.head h1{font-size:42px;margin:0;letter-spacing:-.055em}.head p{color:var(--muted);margin:4px 0 0}
.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.stack{display:grid;gap:14px}.card{background:linear-gradient(155deg,#1b1b1e,#141416);border:1px solid var(--line);border-radius:20px;padding:16px;min-width:0}.label{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:#8b8885;font-weight:900}
.hero{min-height:275px;position:relative;overflow:hidden;background:radial-gradient(circle at 75% 25%,#5b4527,transparent 28%),linear-gradient(150deg,#1e1d1e,#111)}
.skyline{position:absolute;inset:auto 0 0;height:58%;background:linear-gradient(to top,#0b0b0d 5%,transparent),repeating-linear-gradient(90deg,#27272d 0 60px,#1f2025 60px 96px,#34343b 96px 130px)}
.road{position:absolute;left:0;right:0;bottom:0;height:35%;background:linear-gradient(165deg,transparent 0 32%,#1e1e22 32% 76%,transparent 76%)}
.heroText{position:relative;z-index:2;max-width:56%}.heroText h2{font-size:46px;line-height:.95;letter-spacing:-.06em;margin:12px 0}.heroText p{color:#c7c1b9;line-height:1.45}.btn{border:1px solid #3a393d;background:#242428;color:white;border-radius:12px;padding:10px 12px;font-weight:850}.btn.primary{background:var(--gold);border-color:var(--gold);color:#17120a}.btn:disabled{opacity:.35;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#202024;border:1px solid #2d2d31;border-radius:16px;padding:13px}.stat strong{display:block;font-size:24px;margin-top:6px}.bar{height:5px;border-radius:99px;background:#313137;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.mission{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px}.mission h3{margin:6px 0 3px}.mission p{color:var(--muted);margin:0}
.avatarCard{display:grid;grid-template-columns:155px 1fr;align-items:center;min-height:230px}.avatar{height:200px;display:grid;place-items:center;position:relative}.person{position:relative;width:92px;height:180px}.headP{position:absolute;left:28px;top:7px;width:38px;height:46px;border-radius:45% 45% 50% 50%;background:#8a4f2c}.hair{position:absolute;left:20px;top:-1px;width:54px;height:31px;border-radius:60% 60% 40% 40%;background:#15110f}.bodyP{position:absolute;left:20px;top:48px;width:54px;height:74px;border-radius:22px 22px 14px 14px;background:#ef6f8f}.legs{position:absolute;left:22px;top:116px;width:50px;height:61px;background:linear-gradient(90deg,#29282c 0 42%,transparent 42% 58%,#29282c 58%)}.avatarCard h2{font-size:29px;margin:7px 0 2px}.avatarCard p{color:var(--muted);margin:0}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{background:#18181b;border:1px solid #29292e;border-radius:16px;padding:14px}.item strong,.item small{display:block}.item small{color:var(--muted);margin:5px 0 10px;line-height:1.4}.price{font-size:20px;font-weight:950;margin:9px 0}.tag{display:inline-block;font-size:9px;text-transform:uppercase;letter-spacing:.12em;background:#29272a;padding:5px 8px;border-radius:999px;margin-bottom:8px;color:#d8d3cd}
.item button{width:100%}.item.active{outline:2px solid var(--gold)}
.swatch{height:78px;border-radius:13px;margin-bottom:10px;border:1px solid #ffffff12}.carVisual{height:92px;border-radius:14px;background:linear-gradient(145deg,#23252b,#555b65);display:flex;align-items:center;justify-content:center;font-size:48px;margin-bottom:11px}
.profile{display:grid;grid-template-columns:220px 1fr;gap:18px}.profile .bigAvatar{min-height:310px;background:radial-gradient(circle at 50% 32%,#68482c,transparent 30%),#151517;border-radius:22px;display:grid;place-items:center}.profile .person{transform:scale(1.5)}
.notice{position:fixed;right:18px;bottom:18px;background:#fff;color:#111;border-radius:14px;padding:12px 15px;font-weight:800;box-shadow:0 14px 35px #0008;z-index:20;display:none}
input.biz{width:100%;background:#101012;border:1px solid #34343a;color:#fff;border-radius:11px;padding:10px;margin:8px 0}
@media(max-width:980px) and (orientation:landscape){.content{padding:12px 14px}.head h1{font-size:32px}.grid{grid-template-columns:1fr 1fr}.hero{min-height:230px}.heroText h2{font-size:36px}.list{grid-template-columns:repeat(2,minmax(0,1fr))}.nav{width:78px}.app{grid-template-columns:78px minmax(0,1fr)}.nav button{min-height:44px;padding:5px 3px}.nav button b{font-size:14px}}
@media(orientation:portrait){#rotate{display:grid;position:fixed;inset:0;z-index:99;background:#0d0d0e;color:white;place-items:center;text-align:center;padding:34px;font-size:24px;font-weight:900;line-height:1.35}.app{display:none}}
</style>
</head>
<body>
<div id="rotate">Rotate your device to landscape to play LIVIN.</div>
<div class="app" id="app">
  <aside class="nav">
    <div class="logo">LIVIN</div>
    <div class="navlist" id="nav"></div>
    <div class="dot"></div>
  </aside>
  <main class="shell">
    <header class="topbar">
      <div><b id="topTitle">LIVIN</b><small id="topSub">Day 1 · Agege</small></div>
      <div style="display:flex;gap:10px;align-items:center"><span class="previewBadge">LANDSCAPE PREVIEW</span><div class="money" id="money">₦15,000</div></div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="notice" id="notice"></div>
<script>
const navItems=[
 ['home','⌂','Home'],['map','⌖','Lagos'],['city','▣','City'],['work','₦','Jobs'],['property','⌂','Homes'],['style','◫','Style'],['cars','◆','Cars'],['business','▦','Biz'],['social','◎','Pulse'],['profile','◉','You']
];
const state={tab:'home',cash:15000,energy:84,hunger:71,rep:8,day:1,district:'Agege',home:null,mission:0,ownedStyle:[],equippedTop:'#ef6f8f',equippedBottom:'#29282c',cars:[],primaryCar:null,businesses:[],met:[],visits:{}};
const districts=[
 ['Agege','Affordable hustle, crowded streets.',1200],['Yaba','Tech, schools and startup energy.',1200],['Ikeja','Business, government and movement.',1200],['Victoria Island','Corporate money and expensive nights.',2500],['Lekki','Luxury, creators and property.',2500]
];
const jobs=[
 ['Dispatch Assistant','Agege',8500,18],['Junior Developer','Yaba',24000,24],['Sales Associate','Ikeja',16000,20],['Hospitality Host','Victoria Island',18000,22]
];
const homes=[
 ['Mainland Starter Room','Agege',12000,7000,'Starter'],['Yaba Creative Flatshare','Yaba',45000,18000,'Social'],['Ikeja Studio','Ikeja',85000,32000,'Professional'],['VI City Apartment','Victoria Island',220000,75000,'Executive'],['Lekki Duplex','Lekki',380000,120000,'Luxury']
];
const clothes=[
 ['Mainland Black Tee','top',2500,'#20201e','Street'],['Yaba Cream Tee','top',3200,'#eee6d8','Creative'],['Lekki Pink Top','top',4800,'#ef6f8f','Fashion'],['Corporate White Shirt','top',6500,'#f1eee8','Corporate'],['Black Cargo','bottom',5200,'#252323','Street'],['Stone Trouser','bottom',5800,'#6b6258','Smart'],['Pink Cargo','bottom',6200,'#e989a4','Fashion'],['Native Brown Set','set',9000,'#a66b35','Native']
];
const cars=[
 ['City Runner','Compact',65000,'Starter'],['Mainland Sedan','Sedan',120000,'Everyday'],['Delivery Van','Commercial',180000,'Business'],['Island SUV','SUV',260000,'Premium'],['Executive LX','Luxury',520000,'Luxury']
];
const businesses=[
 ['Street Food Spot','Food & Hospitality','Agege',45000],['Salon & Beauty Studio','Beauty & Lifestyle','Yaba',85000],['Local Logistics Company','Logistics','Ikeja',160000],['Tech Startup','Technology','Yaba',220000],['Property Agency','Real Estate','Lekki',400000]
];
const locations=[
 ['mama-t-kitchen',"Mama T's Kitchen",'Agege','Food','Mama T','Food vendor','Eat a full meal',1800,'Hunger +40'],
 ['yaba-cuts','Yaba Cuts','Yaba','Salon','Femi','Barber & stylist','Get styled',4500,'Reputation +2'],
 ['ikeja-auto','Ikeja Auto Works','Ikeja','Mechanic','Kunle','Mechanic','Repair primary vehicle',12000,'Condition → 100%'],
 ['vi-clinic','Harbour Clinic','Victoria Island','Health','Dr. Ada','Doctor','Recover energy',7500,'Energy +25'],
 ['lekki-lounge','Eko Nights Lounge','Lekki','Nightlife','Tola','Host','Spend the evening',15000,'Reputation +3']
];
function money(n){return '₦'+n.toLocaleString()}
function show(msg){const n=document.getElementById('notice');n.textContent=msg;n.style.display='block';clearTimeout(show.t);show.t=setTimeout(()=>n.style.display='none',1800)}
function spend(n){if(state.cash<n){show('You need more cash.');return false}state.cash-=n;return true}
function avatar(){return '<div class="person"><div class="hair"></div><div class="headP"></div><div class="bodyP" style="background:'+state.equippedTop+'"></div><div class="legs" style="background:linear-gradient(90deg,'+state.equippedBottom+' 0 42%,transparent 42% 58%,'+state.equippedBottom+' 58%)"></div></div>'}
function nav(){document.getElementById('nav').innerHTML=navItems.map(x=>'<button class="'+(state.tab===x[0]?'active':'')+'" data-tab="'+x[0]+'"><b>'+x[1]+'</b>'+x[2]+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.tab;render()}))}
function card(title,body){return '<section class="card"><span class="label">'+title+'</span>'+body+'</section>'}
function home(){
 const objective=state.mission===0?'Meet Tunde in Yaba.':state.mission===1?'Complete your first work shift.':state.mission===2?'Secure your first home.':'You found your footing in Lagos.';
 return '<div class="grid"><div class="stack"><section class="card hero"><div class="skyline"></div><div class="road"></div><div class="heroText"><span class="label">WELCOME TO LAGOS</span><h2>Build your life.<br>Own your story.</h2><p>'+state.district+' · '+districts.find(x=>x[0]===state.district)[1]+'</p><button class="btn primary" id="explore">Explore Lagos</button></div></section>'+card('The Lagos Story','<div class="mission"><div><h3>The First Hustle</h3><p>'+objective+'</p></div><button class="btn" id="mission">'+(state.mission>=3?'Completed':'Complete objective')+'</button></div>')+'</div><div class="stack">'+card('Your character','<div class="avatarCard"><div class="avatar">'+avatar()+'</div><div><span class="label">LEKKI BADDIE</span><h2>Preview Player</h2><p>'+state.district+'</p><div class="quick"><button class="btn" data-go="style">Wardrobe</button><button class="btn" data-go="profile">Profile</button></div></div></div>')+'<div class="stats"><div class="stat"><span class="label">Energy</span><strong>'+state.energy+'</strong><div class="bar"><i style="width:'+state.energy+'%"></i></div></div><div class="stat"><span class="label">Hunger</span><strong>'+state.hunger+'</strong><div class="bar"><i style="width:'+state.hunger+'%"></i></div></div><div class="stat"><span class="label">Rep</span><strong>'+state.rep+'</strong><div class="bar"><i style="width:'+Math.min(state.rep*7,100)+'%"></i></div></div></div>'+card('Daily actions','<div class="quick"><button class="btn" id="eat">Eat · ₦1,800</button><button class="btn" id="rest">Rest</button><button class="btn" data-go="business">Build a business</button></div>')+'</div></div>'
}
function listing(arr,type){
 if(type==='map')return '<div class="list">'+arr.map(x=>'<article class="item '+(x[0]===state.district?'active':'')+'"><span class="tag">'+(x[0]===state.district?'You are here':'District')+'</span><strong>'+x[0]+'</strong><small>'+x[1]+'</small><button class="btn" data-travel="'+x[0]+'" '+(x[0]===state.district?'disabled':'')+'>'+(x[0]===state.district?'Current district':'Travel · '+money(x[2]))+'</button></article>').join('')+'</div>';
 if(type==='jobs')return '<div class="list">'+arr.map((x,i)=>'<article class="item"><span class="tag">Career</span><strong>'+x[0]+'</strong><small>'+x[1]+' · Energy -'+x[3]+'</small><div class="price">'+money(x[2])+'</div><button class="btn primary" data-work="'+i+'">Work shift</button></article>').join('')+'</div>';
}
function render(){
 nav();document.getElementById('money').textContent=money(state.cash);document.getElementById('topSub').textContent='Day '+state.day+' · '+state.district;
 const c=document.getElementById('content');let html='';
 if(state.tab==='home')html=home();
 if(state.tab==='map')html='<div class="head"><div><h1>Lagos</h1><p>Move through districts and build a different life in each one.</p></div></div>'+listing(districts,'map');
 if(state.tab==='city'){const here=locations.filter(x=>x[2]===state.district);html='<div class="head"><div><h1>'+state.district+'</h1><p>Meet people, use local services and make the district feel like home.</p></div></div><div class="list">'+here.map((x,i)=>'<article class="item"><span class="tag">'+x[3]+'</span><strong>'+x[1]+'</strong><small>'+x[4]+' · '+x[5]+'</small><small>'+x[6]+' · '+x[8]+'</small><div class="price">'+money(x[7])+'</div><div class="quick"><button class="btn" data-meet="'+x[0]+'">'+(state.met.includes(x[0])?'Met':'Meet '+x[4])+'</button><button class="btn primary" data-service="'+x[0]+'">Use service</button></div><small>'+(state.visits[x[0]]?state.visits[x[0]]+' visit'+(state.visits[x[0]]===1?'':'s'):'Not visited yet')+'</small></article>').join('')+'</div>';} 
 if(state.tab==='work')html='<div class="head"><div><h1>Jobs</h1><p>Earn money, build reputation and fund your next move.</p></div></div>'+listing(jobs,'jobs');
 if(state.tab==='property')html='<div class="head"><div><h1>Property</h1><p>Secure a place to live and upgrade as your income grows.</p></div></div>'+(state.home?card('Current home','<h3>'+state.home[0]+'</h3><p>'+state.home[1]+' · Weekly '+money(state.home[3])+'</p>'):'')+'<div class="list">'+homes.map((x,i)=>'<article class="item"><span class="tag">'+x[4]+'</span><strong>'+x[0]+'</strong><small>'+x[1]+'</small><div class="price">'+money(x[2])+' move-in</div><button class="btn" data-home="'+i+'">'+(state.district!==x[1]?'Travel there first':'Rent home')+'</button></article>').join('')+'</div>';
 if(state.tab==='style')html='<div class="head"><div><h1>Wardrobe</h1><p>Buy clothing and equip your look.</p></div></div>'+card('Current look','<div class="avatarCard"><div class="avatar">'+avatar()+'</div><div><h2>Preview Player</h2><p>'+state.ownedStyle.length+' owned items</p></div></div>')+'<div class="list">'+clothes.map((x,i)=>'<article class="item"><div class="swatch" style="background:'+x[3]+'"></div><span class="tag">'+x[4]+'</span><strong>'+x[0]+'</strong><small>'+x[1]+'</small><div class="price">'+money(x[2])+'</div><button class="btn" data-cloth="'+i+'">'+(state.ownedStyle.includes(i)?'Equip':'Buy item')+'</button></article>').join('')+'</div>';
 if(state.tab==='cars')html='<div class="head"><div><h1>Vehicles</h1><p>Own your transport and build status across the city.</p></div></div>'+(state.cars.length?card('Your garage',state.cars.map(i=>'<div class="item '+(state.primaryCar===i?'active':'')+'"><strong>'+cars[i][0]+'</strong><small>'+cars[i][1]+' · Condition 100% · Fuel 100%</small><button class="btn" data-primary="'+i+'">'+(state.primaryCar===i?'Primary vehicle':'Make primary')+'</button></div>').join('')):'')+'<div class="list">'+cars.map((x,i)=>'<article class="item"><div class="carVisual">◢▰</div><span class="tag">'+x[3]+'</span><strong>'+x[0]+'</strong><small>'+x[1]+'</small><div class="price">'+money(x[2])+'</div><button class="btn" data-car="'+i+'">'+(state.cars.includes(i)?'Owned':'Buy vehicle')+'</button></article>').join('')+'</div>';
 if(state.tab==='business')html='<div class="head"><div><h1>Businesses</h1><p>Turn earned money into companies and ownership.</p></div></div>'+(state.businesses.length?card('Owned businesses',state.businesses.map(b=>'<div class="item"><span class="tag">Level 1</span><strong>'+b.name+'</strong><small>'+b.type+' · '+b.district+'</small><div class="price">₦0 business cash</div></div>').join('')):'')+'<div class="list">'+businesses.map((x,i)=>'<article class="item"><span class="tag">'+x[1]+'</span><strong>'+x[0]+'</strong><small>'+x[2]+' · Startup capital</small><div class="price">'+money(x[3])+'</div><input class="biz" id="biz'+i+'" placeholder="Business name"><button class="btn" data-biz="'+i+'">'+(state.district!==x[2]?'Travel there first':'Open business')+'</button></article>').join('')+'</div>';
 if(state.tab==='social')html='<div class="head"><div><h1>Pulse</h1><p>The social layer of the city.</p></div></div><div class="list"><article class="item"><span class="tag">Ikeja</span><strong>Ayo</strong><small>Restaurant owner · Looking for staff</small><button class="btn">Connect</button></article><article class="item"><span class="tag">Yaba</span><strong>Zina</strong><small>Designer · Creative community</small><button class="btn">Connect</button></article><article class="item"><span class="tag">Lekki</span><strong>Kola</strong><small>Property agent · New listing</small><button class="btn">Connect</button></article></div>';
 if(state.tab==='profile')html='<div class="head"><div><h1>Your life</h1><p>One character, one economy, one Lagos story.</p></div></div><div class="profile"><div class="bigAvatar">'+avatar()+'</div><div class="stack">'+card('Profile','<span class="label">PREVIEW PLAYER</span><h2 style="font-size:38px;margin:7px 0">Preview Player</h2><p style="color:var(--muted)">Lekki Baddie · '+state.district+'</p>')+'<div class="stats"><div class="stat"><span class="label">Cash</span><strong>'+money(state.cash)+'</strong></div><div class="stat"><span class="label">Businesses</span><strong>'+state.businesses.length+'</strong></div><div class="stat"><span class="label">Vehicles</span><strong>'+state.cars.length+'</strong></div></div>'+card('Progress','<p>Home: '+(state.home?state.home[0]:'None')+'</p><p>Story: '+(state.mission>=3?'The First Hustle complete':'In progress')+'</p>')+'</div></div>';
 c.innerHTML=html;wire();
}
function wire(){
 document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.go;render()}));
 const ex=document.getElementById('explore');if(ex)ex.onclick=()=>{state.tab='map';render()};
 const eat=document.getElementById('eat');if(eat)eat.onclick=()=>{if(spend(1800)){state.hunger=Math.min(100,state.hunger+35);show('Meal purchased.');render()}};
 const rest=document.getElementById('rest');if(rest)rest.onclick=()=>{state.energy=Math.min(100,state.energy+40);state.day++;show('You rested.');render()};
 const mission=document.getElementById('mission');if(mission)mission.onclick=()=>{if(state.mission===0&&state.district!=='Yaba')return show('Travel to Yaba first.');if(state.mission===1&&state.rep<9)return show('Complete a work shift first.');if(state.mission===2&&!state.home)return show('Secure a home first.');if(state.mission<3){state.mission++;if(state.mission===2)state.cash+=5000;show('Story objective completed.');render()}};
 document.querySelectorAll('[data-travel]').forEach(b=>b.addEventListener('click',()=>{const d=districts.find(x=>x[0]===b.dataset.travel);if(spend(d[2])){state.district=d[0];state.energy=Math.max(0,state.energy-5);show('Arrived in '+d[0]+'.');render()}}));
 document.querySelectorAll('[data-work]').forEach(b=>b.addEventListener('click',()=>{const j=jobs[+b.dataset.work];if(state.energy<j[3])return show('Not enough energy.');state.cash+=j[2];state.energy-=j[3];state.hunger=Math.max(0,state.hunger-10);state.rep++;state.day++;show('Shift complete.');render()}));
 document.querySelectorAll('[data-meet]').forEach(b=>b.addEventListener('click',()=>{const key=b.dataset.meet;if(!state.met.includes(key)){state.met.push(key);state.rep++;state.visits[key]=(state.visits[key]||0)+1;show('New contact added.');render()}}));
 document.querySelectorAll('[data-service]').forEach(b=>b.addEventListener('click',()=>{const key=b.dataset.service,x=locations.find(v=>v[0]===key);if(!spend(x[7]))return;state.visits[key]=(state.visits[key]||0)+1;if(key==='mama-t-kitchen')state.hunger=Math.min(100,state.hunger+40);if(key==='yaba-cuts')state.rep+=2;if(key==='ikeja-auto'&&state.primaryCar===null){state.cash+=x[7];return show('Buy and select a primary vehicle first.')}if(key==='vi-clinic')state.energy=Math.min(100,state.energy+25);if(key==='lekki-lounge'){state.rep+=3;state.energy=Math.max(0,state.energy-8)}show('Service completed.');render()}));
 document.querySelectorAll('[data-home]').forEach(b=>b.addEventListener('click',()=>{const h=homes[+b.dataset.home];if(state.district!==h[1])return show('Travel to '+h[1]+' first.');if(spend(h[2])){state.home=h;show('New home secured.');render()}}));
 document.querySelectorAll('[data-cloth]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.cloth,x=clothes[i];if(!state.ownedStyle.includes(i)){if(!spend(x[2]))return;state.ownedStyle.push(i)}if(x[1]==='top')state.equippedTop=x[3];else if(x[1]==='bottom')state.equippedBottom=x[3];else{state.equippedTop=x[3];state.equippedBottom=x[3]}show('Outfit updated.');render()}));
 document.querySelectorAll('[data-car]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.car,x=cars[i];if(state.cars.includes(i))return show('Already owned.');if(spend(x[2])){state.cars.push(i);if(state.primaryCar===null)state.primaryCar=i;state.rep++;show('Vehicle purchased.');render()}}));
 document.querySelectorAll('[data-primary]').forEach(b=>b.addEventListener('click',()=>{state.primaryCar=+b.dataset.primary;show('Primary vehicle updated.');render()}));
 document.querySelectorAll('[data-biz]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.biz,x=businesses[i];if(state.district!==x[2])return show('Travel to '+x[2]+' first.');const name=document.getElementById('biz'+i).value.trim();if(name.length<2)return show('Name your business.');if(spend(x[3])){state.businesses.push({name,type:x[1],district:x[2]});state.rep+=3;show('Business opened.');render()}}));
}
render();
</script>
</body>
</html>
